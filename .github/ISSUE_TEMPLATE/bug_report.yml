name: 不具合報告
description: 再現可能な不具合を記録する
title: "[BUG] "
labels:
  - "type:bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: Windows、AHK v2、AHIのバージョン。個人情報や固有識別子は含めない
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 関連ID・ログ・コミット
      description: 関連IDや安全に公開できる最小限のログ
    validations:
      required: false
